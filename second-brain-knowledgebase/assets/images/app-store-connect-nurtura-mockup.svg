<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">App Store Connect Nurtura mockup</title>
  <desc id="desc">Mock App Store Connect form for Nurtura metadata, privacy, screenshots, and Watch app.</desc>
  <rect width="1200" height="760" fill="#f7f7fb"/>
  <rect x="60" y="55" width="1080" height="650" fill="#fff" stroke="#d8dee4" rx="18"/>
  <text x="100" y="115" font-family="Arial" font-size="30" font-weight="700" fill="#1d2327">App Store Connect - Nurtura</text>
  <rect x="100" y="160" width="440" height="120" fill="#f8fbff" stroke="#bdd7ee" rx="10"/>
  <text x="130" y="205" font-family="Arial" font-size="22" font-weight="700" fill="#102a43">iOS App Version</text>
  <text x="130" y="240" font-family="Arial" font-size="19" fill="#334e68">Name, subtitle, screenshots, build</text>
  <rect x="620" y="160" width="420" height="120" fill="#f0fff4" stroke="#68d391" rx="10"/>
  <text x="650" y="205" font-family="Arial" font-size="22" font-weight="700" fill="#276749">watchOS Info</text>
  <text x="650" y="240" font-family="Arial" font-size="19" fill="#276749">Watch screenshots and companion app notes</text>
  <rect x="100" y="340" width="940" height="90" fill="#fff7ed" stroke="#f6ad55" rx="10"/>
  <text x="130" y="395" font-family="Arial" font-size="22" font-weight="700" fill="#9c4221">Complete App Privacy and medical device declaration before review</text>
  <rect x="100" y="500" width="940" height="90" fill="#f7fafc" stroke="#cbd5e0" rx="10"/>
  <text x="130" y="555" font-family="Arial" font-size="21" font-weight="700" fill="#2d3748">Reviewer note: care coordination, not diagnosis or treatment</text>
</svg>
